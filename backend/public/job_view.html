<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Job Tracker</title>
<style>
  .app {
    display: grid;
    height: 100vh;
    box-sizing: border-box;
    gap: 12px;
    padding: 12px;
    grid-template-rows: 200px 1fr;       /* viz height  | content fills rest */
    grid-template-columns: 280px 500px 1fr;
    grid-template-areas:
      "top  top top"
      "list detail extra-viz";
  }

  #extra-viz-panel {
    grid-area: extra-viz;
    display: flex;
    flex-direction: column;      /* children stack top to bottom */
    justify-content: flex-end;   /* stack to the bottom */
    align-items: center;         /* horizontal centering */
    overflow: auto;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 20px;
  }

  /* make heatmap github's size */
  #calendar.heat-js {
    /* heat.js pads each month to whole columns, so a year is ~64 columns.
       total width is roughly 64 * (day-size + day-spacing) */
    --heat-js-day-size: 10px; /* cell width */
    --heat-js-day-spacing: 2px;
    --heat-js-spacing: 6px;
    --heat-js-spacing-font-size: 0.7rem;
    --heat-js-default-width: 760px;   /* max-width is this + 50, has to clear the columns */

    width: fit-content;
  }

  #top-panel {
    grid-area: top;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;   /* keep padding + border inside the 200px row */
    padding: 12px;
    overflow-x: auto;         /* scroll sideways through all the viz */
    overflow-y: hidden;
    display: flex;            /* all the charts in one horizontal row */
    align-items: center;
    gap: 24px;
  }

  /* one chart slot in the top panel. flex-shrink so the row scrolls instead of squashing */
  .chart-box {
    height: 155px;
    width: 280px;
    flex-shrink: 0;
  }
  .chart-box.wide {
    width: 400px;
  }

  /* column so the menu can be a fixed bar and only the tile list scrolls.
     overflow hidden here, the scrolling moved down to #tiles */
  #list-panel {
    grid-area: list;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #ccc;
    border-radius: 8px;
  }

  #tile_menu {
    flex-shrink: 0;            /* stays put, never squashed by the list below */
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px;
    border-bottom: 1px solid #ccc;
    background: #fafafa;
  }

  #tiles {
    flex: 1;              /* takes whatever height is left under the menu */
    overflow-y: auto;     /* the only thing that scrolls */
  }
  
  .tile {
    padding: 12px;
    border-bottom: 1px solid #eee;
    border-left: 25px solid transparent;   /* every tile reserves the stripe so text never shifts */
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* priority buckets. only show up when sorting by priority.
     rgba's 4th number is opacity, 0 is invisible and 1 is solid.
     bucket 1 reads --shade off the tile, which job_view.js sets per row so the
     most neglected application is darkest. 0.55 is the fallback if it isn't set. */
  .tile.bucket-1 { border-left-color: rgba(235, 104, 52, var(--shade, 0.55)); }  /* no reach-out yet */
  .tile.bucket-2 { border-left-color: rgba(42, 120, 214, 0.55); }                /* reached out, waiting */
  .tile.bucket-3 { border-left-color: rgba(196, 196, 196, 0.55); }               /* stale, 30+ days */
  .tile .trash {
    cursor: pointer;
    margin-left: 8px;
  }
  .tile .trash:hover {
    filter: sepia(1) saturate(10000%) hue-rotate(-30deg);
  }
  .tile:hover {
    background: #f5f5f5;
  }
  .tile .company {
    font-weight: bold;
  }
  .tile .status {
    font-size: 13px;
    color: #666;
  }

  #detail-panel {
    grid-area: detail;
    padding: 20px;
    overflow-y: auto;
    border: 1px solid #ccc;
    border-radius: 8px;
  }

  /* status trail: frozen chips for past statuses, live dropdown as the last chip */
  #status_strip {
    display: flex;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 8px;
    margin: 4px 0 14px;
  }
  #status_ghosts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .trail-chip, #status_current {
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 13px;
    min-width: 96px;
  }
  .trail-chip {
    background: #f5f5f5;
    color: #666;
  }
  #status_current {
    border-color: #999;
  }
  .trail-date, #status_current_date {
    font-size: 12px;
    color: #888;
    margin-top: 3px;
  }
  .trail-x {
    cursor: pointer;
    margin-left: 7px;
    color: #b00;
    font-weight: bold;
  }
  .trail-x:hover {
    text-decoration: underline;
  }

  #date_dialog {
    border: 1px solid #999;
    border-radius: 8px;
    padding: 18px;
    font-family: sans-serif;
  }
  #date_dialog menu {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin: 14px 0 0;
    padding: 0;
  }

</style>
</head>
<body style="margin:0; font-family: sans-serif;">

  <div class="app">
    <!-- **** TILE (TOP) PANEL ***** -->
    <div id="top-panel"></div>

    <!-- **** TILE (bottom left) PANEL ***** -->
    <div id="list-panel">
      <div id="tile_menu">
        <select id="sort_select">
          <option value="company">Company</option>
          <option value="applied_date">Date applied</option>
          <option value="priority">Priority</option>
        </select>
        <button id="add_button">+</button>
      </div>
      <div id="tiles"></div>
      <!-- tiles get added here by JS -->
    </div>

    <!-- **** VIZ (bottom right) PANEL ***** -->
    <div id="extra-viz-panel"></div>

    <!-- **** DISPLAY (bottom middle) PANEL ***** -->
    <div id="detail-panel">
      <p id="detail-empty">Select a job to see details.</p>
      <div id="detail-content" style="display:none;">
        <p><strong>Company:</strong></p>
        <h2 id="detail-company"></h2>
        <textarea id="company_textarea" style="display:none;"></textarea>

        <p><strong>Role:</strong> <span id="detail-role"></span></p>
        <textarea id="role_textarea" style="display:none;"></textarea>

        <p><strong>Req #:</strong> <span id="detail-req-num"></span></p>
        <textarea id="req_num_textarea" style="display:none;"></textarea>

        <p><strong>Status:</strong> <span id="detail-status"></span></p>

        <div id="status_strip">
          <div id="status_ghosts"></div>
          <div id="status_current">
            <select id="status_dropdown" style="display:none;">
                <option>SAVED</option>
                <option>PENDING</option>
                <option>INTERVIEW</option>
                <option>OFFER</option>
                <option>REJECTED</option>
            </select>
            <div id="status_current_date"></div>
          </div>
        </div>
        <!-- written only by the trail; applied_date and interviewed_date already have their own rows -->
        <input id="offer_date_select" type="date" style="display:none;">
        <input id="rejected_date_select" type="date" style="display:none;">

        <p><strong>Interest:</strong> <span id="detail-interest"></span></p>
        <select id="interest_dropdown" style="display:none;">
            <option value="">—</option>
            <option>Rep Farm</option>
            <option>Safety</option>
            <option>Priority</option>
        </select>

        <p><strong>Lane:</strong> <span id="detail-lane"></span></p>
        <select id="lane_dropdown" style="display:none;">
            <option value="">—</option>
            <option>SWE</option>
            <option>DE</option>
            <option>DS</option>
            <option>DA</option>
            <option>AI</option>
            <option>SE/FDE</option>
        </select>

        <p><strong>Applied:</strong> <span id="detail-applied"></span></p>
        <input id="applied_date_select" type="date" style="display:none;">


        <p><strong>Interviewed:</strong> <span id="detail-interviewed"></span></p>
        <input id="interviewed_date_select" type="date" style="display:none;">

        <p><strong>Reached out:</strong> <span id="detail-reached-out"></span></p>
        <input id="reached_out_date_select" type="date" style="display:none;">

        <p><strong>Match %:</strong> <span id="detail-match"></span></p>
        <textarea id="match_textarea" style="display:none;"></textarea>

        <p><strong>Salary band:</strong> <span id="detail-band"></span></p>
        <!-- margins leave room for the handle tooltips above and the requested-salary pip below -->
        <div id="band_slider" style="display:none; margin: 34px 10px 40px;"></div>

        <p><strong>Requested:</strong> <span id="detail-salary"></span></p>
        <input id="salary_input" type="number" step="1000" style="display:none;">

        <p><strong>Link:</strong> <a id="detail-url" href="#" target="_blank"></a></p>
        <textarea id="url_textarea" style="display:none;"></textarea>

        <p><strong>Notes:</strong></p>
        <p id="detail-notes"></p>
        <textarea id="notes_textarea" style="display:none;"></textarea>
      </div>
      <button id="edit_button" style="display:none;">Edit</button>
      <button id="cancel_button" style="display:none;">Cancel</button>
      <button id="submit_button" style="display:none;">Submit</button>
    </div>

    </div>

    <dialog id="date_dialog">
      <form method="dialog">
        <p id="date_dialog_label">Date of this status change</p>
        <input id="date_dialog_input" type="date">
        <menu>
          <button value="cancel">Cancel</button>
          <button value="ok">Confirm</button>
        </menu>
      </form>
    </dialog>

    <!-- noUiSlider from CDN — must load before job_view.js so `noUiSlider` exists -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.8.1/nouislider.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.8.1/nouislider.min.js"></script>
    <script src="job_view.js"></script>
    <!-- Chart.js from CDN — must load before analytics_view.js so `Chart` exists -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
    <!-- sankey chart type for Chart.js — must load after it, it registers itself on load -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-sankey@0.15.0/dist/chartjs-chart-sankey.min.js"></script>
    <!-- Heat.js from CDN — must load before analytics_view.js so `$heat` exists -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/williamtroup/Heat.js@5.2.0/dist/heat.js.min.css">
    <script src="https://cdn.jsdelivr.net/gh/williamtroup/Heat.js@5.2.0/dist/heat.min.js"></script>
    <script src="analytics_view.js"></script>
</body>
</html>
